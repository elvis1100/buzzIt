name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_root_downloads:
        description: Commit the three freshly built downloads to the repository root
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk BuzzIt-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: buzzit-android-apk
          path: BuzzIt-Android.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf BuzzIt-Linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: buzzit-linux-x64
          path: BuzzIt-Linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler is unavailable."
          }
          & $compiler packaging/windows/BuzzIt.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          Copy-Item packaging/windows/output/BuzzItSetup.exe BuzzIt-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: buzzit-windows-setup
          path: BuzzIt-Windows-Setup.exe

  publish-root-downloads:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.update_root_downloads
    needs: [quality-and-android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: buzzit-android-apk
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: buzzit-linux-x64
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: buzzit-windows-setup
          path: .
      - name: Commit current downloads
        run: |
          git add BuzzIt-Android.apk BuzzIt-Linux-x64.tar.gz BuzzIt-Windows-Setup.exe
          if git diff --cached --quiet; then
            echo "Downloads are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update downloadable builds"
          git push origin HEAD:master
